<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Corporate Assessment Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <h2>Portal Login Assessment</h2>
      <p class="login-subtitle">Masukkan akun terdaftar untuk memulai sesi ujian.</p>
      <form id="loginForm">
        <div class="input-group">
          <label>Email Kandidat / Admin</label>
          <input type="email" id="email" required class="form-control" placeholder="user@example.com">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" required class="form-control" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary login-btn">Masuk Sistem</button>
      </form>
    </div>
  </div>
</body>
</html>
